<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&family=Pirata+One&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
    <title>miniGame</title>
    <!-- Terapkan tema gelap tersimpan SEBELUM render pertama, supaya
    tidak ada kilat tema terang saat user menyimpan dark. -->
    <script>
      try {
        if (localStorage.getItem("minigame:theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
